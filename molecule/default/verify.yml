---
- name: Verify OxiTraffic
  hosts: all
  become: true
  gather_facts: false

  vars:
    oxitraffic_verify_url: "http://127.0.0.1:{{ oxitraffic_container_http_port }}"

    # The role's identifier is also the directory it installs into, and role
    # defaults are not in scope in a verify play.
    oxitraffic_verify_config_path: "/{{ oxitraffic_molecule_container }}/config.toml"

    # The names carry both the role and the scenario, like the platform does,
    # so a leftover container can never be mistaken for another scenario's.
    oxitraffic_verify_stock_container: "{{ inventory_hostname }}-stock-control"
    oxitraffic_verify_dbless_container: "{{ inventory_hostname }}-dbless-control"
    oxitraffic_verify_offline_container: "{{ inventory_hostname }}-offline-control"

    oxitraffic_verify_psql: >-
      docker exec {{ oxitraffic_molecule_postgres_container }}
      psql -U {{ oxitraffic_molecule_postgres_superuser }}
      -d {{ oxitraffic_database_name }} -tAc

    # The page view the round trip records. Distinctive enough that finding it
    # in Postgres cannot be a coincidence.
    oxitraffic_verify_path: /molecule-round-trip-page

    # Nobody ever visits this one. Asking for its count proves the read-back is
    # a query that discriminates, rather than a call returning whatever exists.
    oxitraffic_verify_absent_path: /molecule-never-visited-page

    # OxiTraffic will not count a visit registered less than `min_delay_secs`
    # ago, which defaults to 19 and which the role does not currently override.
    # A second over it, so the round trip clears the gate on the first try.
    oxitraffic_verify_min_delay_seconds: 20

  tasks:
    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: oxitraffic_defaults

    # `--type container` is not optional here: the role gives the container and
    # the container network the same name, and a bare `docker inspect` answers
    # with whichever it finds first.
    - name: Read the OxiTraffic container the role created
      ansible.builtin.command:
        cmd: "docker inspect --type container {{ oxitraffic_molecule_container }}"
      register: oxitraffic_container_raw
      changed_when: false

    - name: Make sense of the OxiTraffic container
      ansible.builtin.set_fact:
        oxitraffic_container: "{{ (oxitraffic_container_raw.stdout | from_json)[0] }}"

    # ------------------------------------------------------------------
    # The negative controls: the same image, without the role's doing
    # ------------------------------------------------------------------

    # Nothing asserted below is evidence about the role unless the stock image
    # cannot produce it unaided. It cannot: OXITRAFFIC_CONFIG_FILE points at a
    # path the image does not ship, and OxiTraffic refuses to start without the
    # configuration it names.
    - name: Run the OxiTraffic image with none of the role's configuration
      ansible.builtin.command:
        cmd: >-
          timeout 60
          docker run --rm --name {{ oxitraffic_verify_stock_container }}
          {{ oxitraffic_container.Config.Image }}
      register: oxitraffic_stock_control
      changed_when: true
      failed_when: false

    - name: Assert the OxiTraffic image cannot start without the role's configuration
      ansible.builtin.assert:
        # 0 would mean it ran to completion, 124 that `timeout` had to stop a
        # container which was happily running. Either would make everything
        # below unattributable to the role.
        that:
          - oxitraffic_stock_control.rc not in [0, 124]
          - "'Failed to parse the configuration' in oxitraffic_stock_control.stderr"
        fail_msg: >-
          The unconfigured OxiTraffic image exited with {{ oxitraffic_stock_control.rc }}
          ({{ oxitraffic_stock_control.stderr | default('') | truncate(300) }}),
          so nothing below can be credited to the role
        success_msg: >-
          The unconfigured OxiTraffic image dies on startup (rc={{ oxitraffic_stock_control.rc }},
          "Failed to parse the configuration"), so an OxiTraffic that serves anything at
          all is the role's doing

    # The sharper Postgres control. This run gets the role's own rendered
    # config.toml, unmodified, and the same image, and differs in exactly one
    # respect: the Unix socket the role bind-mounts is not given to it. If
    # OxiTraffic could fall back to an embedded or in-memory store, this is
    # where it would - and everything the round trip below proves about Postgres
    # would be worth nothing.
    - name: Run the OxiTraffic image without the Postgres socket the role mounts
      ansible.builtin.command:
        cmd: >-
          timeout 60
          docker run --rm --name {{ oxitraffic_verify_dbless_container }}
          --network {{ oxitraffic_molecule_network }}
          --mount type=bind,src={{ oxitraffic_verify_config_path }},dst=/volumes/config.toml,ro
          {{ oxitraffic_container.Config.Image }}
      register: oxitraffic_dbless_control
      changed_when: true
      failed_when: false

    - name: Assert OxiTraffic will not run without the Postgres the role wired up
      ansible.builtin.assert:
        that:
          - oxitraffic_dbless_control.rc not in [0, 124]
          - "'Failed to connect to the PostgreSQL database' in oxitraffic_dbless_control.stderr"
        fail_msg: >-
          OxiTraffic did not refuse to run without its Postgres socket
          (rc={{ oxitraffic_dbless_control.rc }}):
          {{ oxitraffic_dbless_control.stderr | default('') | truncate(300) }}.
          It has a fallback store, and the Postgres cross-check below proves less
          than it appears to.
        success_msg: >-
          OxiTraffic refuses to start when the socket the role mounts is absent
          (rc={{ oxitraffic_dbless_control.rc }}, "Failed to connect to the PostgreSQL
          database"), so there is no fallback store it could be using instead

    # The tracked-website control. Same image and every mount the role made,
    # the Postgres socket among them, so it gets all the way past the database
    # and the migrations; only the network is taken away. The error names the
    # callback URL it was reaching for, which is how
    # `oxitraffic_tracked_origin_callback` is shown to have arrived inside the
    # process rather than merely on disk.
    - name: Run the OxiTraffic image with no way to reach the tracked website
      ansible.builtin.command:
        cmd: >-
          timeout 90
          docker run --rm --name {{ oxitraffic_verify_offline_container }}
          --network none
          {% for mount in oxitraffic_container.Mounts %}--mount type=bind,src={{ mount.Source }},dst={{ mount.Destination }} {% endfor %}
          {{ oxitraffic_container.Config.Image }}
      register: oxitraffic_offline_control
      changed_when: true
      failed_when: false

    - name: Assert OxiTraffic checks the tracked website the role configured
      ansible.builtin.assert:
        that:
          - oxitraffic_offline_control.rc not in [0, 124]
          - >-
            ('Failed to connect to the tracked website ' ~ oxitraffic_tracked_origin_callback)
            in oxitraffic_offline_control.stderr
        fail_msg: >-
          OxiTraffic did not report {{ oxitraffic_tracked_origin_callback }} as the tracked
          website it could not reach (rc={{ oxitraffic_offline_control.rc }}):
          {{ oxitraffic_offline_control.stderr | default('') | truncate(300) }}
        success_msg: >-
          OxiTraffic names {{ oxitraffic_tracked_origin_callback }} as the website it
          checks at startup, so `oxitraffic_tracked_origin_callback` reached the process

    # ------------------------------------------------------------------
    # The unit is up and OxiTraffic itself answers
    # ------------------------------------------------------------------

    - name: Wait for the OxiTraffic systemd service to become active (up to 180s)
      ansible.builtin.systemd_service:
        name: oxitraffic.service
      register: oxitraffic_service
      until: oxitraffic_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert the OxiTraffic systemd service is active
      ansible.builtin.assert:
        that: oxitraffic_service.status.ActiveState == 'active'
        fail_msg: "oxitraffic.service is not active ({{ oxitraffic_service.status.ActiveState }})"
        success_msg: "oxitraffic.service is active"

    - name: Retrieve the OxiTraffic service log for debugging
      when: oxitraffic_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu oxitraffic.service
      changed_when: false

    # `active` only says the docker client is running. The dashboard is served by
    # OxiTraffic itself, and only once it has connected to Postgres, run its
    # migrations, reached the tracked website and opened its listener.
    - name: Wait for OxiTraffic to serve its dashboard (up to 5m)
      ansible.builtin.uri:
        url: "{{ oxitraffic_verify_url }}/"
        follow_redirects: none
        return_content: true
        status_code: [200, 404, 502, 503]
      register: oxitraffic_dashboard
      until: oxitraffic_dashboard.status == 200
      retries: 60
      delay: 5

    # ------------------------------------------------------------------
    # The running process is the version this role pins
    # ------------------------------------------------------------------

    # OxiTraffic renders `env!("CARGO_PKG_VERSION")` into the footer of every
    # dashboard page, so this is the version compiled into the binary that is
    # actually serving, not a label on the image. The image carries no version
    # label at all - the only one it has is `io.buildah.version`, which is the
    # version of the tool that built it.
    - name: Assert the running OxiTraffic is the version this role installs
      ansible.builtin.assert:
        that:
          - (oxitraffic_defaults.oxitraffic_version ~ ' - <a href="https://codeberg.org/mo8it/oxitraffic"') in oxitraffic_dashboard.content
          - (oxitraffic_container.Config.Image | split(':') | last) == oxitraffic_defaults.oxitraffic_version
        fail_msg: >-
          The dashboard footer reports
          {{ oxitraffic_dashboard.content | regex_search('v[0-9][0-9.]* - <a href="https://codeberg.org/mo8it/oxitraffic"') | default('no version at all', true) }}
          out of image {{ oxitraffic_container.Config.Image }}, but `oxitraffic_version`
          pins {{ oxitraffic_defaults.oxitraffic_version }}
        success_msg: >-
          The running OxiTraffic reports itself as {{ oxitraffic_defaults.oxitraffic_version }}
          in its dashboard footer, out of {{ oxitraffic_container.Config.Image }}, which is
          what `oxitraffic_version` pins

    # ------------------------------------------------------------------
    # Configuration reaches the process, not just the files on disk
    # ------------------------------------------------------------------

    # OxiTraffic falls back to 0.0.0.0:80 when `socket_address` is absent from
    # its configuration, and the role's own default is 8080. This scenario picks
    # neither, so every answer above already depended on the `socket_address`
    # line of the role's config.toml having been rendered and read. This states
    # it outright.
    - name: Assert OxiTraffic listens where the role told it to
      ansible.builtin.assert:
        that:
          - oxitraffic_container_http_port not in [80, 8080]
          - oxitraffic_dashboard.status == 200
        fail_msg: >-
          OxiTraffic answered on {{ oxitraffic_container_http_port }}, which is one of the
          ports it would have picked on its own
        success_msg: >-
          OxiTraffic answers on {{ oxitraffic_container_http_port }} rather than its own
          default of 80 or the role's default of 8080, because `socket_address` in the
          role's config.toml said so

    # The tracking script websites embed is rendered at startup out of the
    # `base_url` in the role's config.toml, so the URL baked into it is a
    # value only the role's template could have produced.
    - name: Fetch the tracking script OxiTraffic serves
      ansible.builtin.uri:
        url: "{{ oxitraffic_verify_url }}/count.js"
        return_content: true
        status_code: [200]
      register: oxitraffic_count_js

    - name: Assert the tracking script was built from the role's configuration
      ansible.builtin.assert:
        that:
          - ('"' ~ oxitraffic_scheme ~ '://' ~ oxitraffic_hostname ~ '/register?path="') in oxitraffic_count_js.content
          - oxitraffic_count_js.content_type == 'text/javascript'
          # CorsLayer is built from `tracked_origin`, and this is the only place
          # that value is observable from outside the process.
          - oxitraffic_count_js.access_control_allow_origin == oxitraffic_tracked_origin
        fail_msg: >-
          count.js does not point at {{ oxitraffic_scheme }}://{{ oxitraffic_hostname }}
          (or allows origin {{ oxitraffic_count_js.access_control_allow_origin | default('none') }}
          rather than {{ oxitraffic_tracked_origin }}):
          {{ oxitraffic_count_js.content | truncate(300) }}
        success_msg: >-
          count.js calls back to {{ oxitraffic_scheme }}://{{ oxitraffic_hostname }} and is
          served for origin {{ oxitraffic_tracked_origin }}, both of which come from the
          role's `oxitraffic_scheme`, `oxitraffic_hostname` and `oxitraffic_tracked_origin`

    # ------------------------------------------------------------------
    # A page view goes in the front door and comes out of Postgres
    # ------------------------------------------------------------------

    - name: Sample the OxiTraffic restart counter before the round trip
      ansible.builtin.systemd_service:
        name: oxitraffic.service
      register: oxitraffic_restarts_before

    - name: Count visits to the page before it has been visited
      ansible.builtin.uri:
        url: "{{ oxitraffic_verify_url }}/api/count?path={{ oxitraffic_verify_path | urlencode }}"
        return_content: true
        status_code: [200]
      register: oxitraffic_count_before

    # Registering is what a browser running count.js does first. OxiTraffic looks
    # the path up on the tracked website before it will accept it, so this only
    # succeeds because the stub answers at the callback URL the role configured.
    - name: Register a page view, the way the tracking script would
      ansible.builtin.uri:
        url: "{{ oxitraffic_verify_url }}/register?path={{ oxitraffic_verify_path | urlencode }}"
        return_content: true
        status_code: [200]
      register: oxitraffic_registration

    # Visits are only counted after the visitor has stayed `min_delay_secs`.
    # Reporting immediately must be refused - otherwise the wait below would be
    # proving nothing, and a single scripted request could inflate a counter.
    - name: Report the visit immediately, before the minimum delay has passed
      ansible.builtin.uri:
        url: "{{ oxitraffic_verify_url }}/post-sleep/{{ oxitraffic_registration.content | trim }}"
        status_code: [200, 400]
      register: oxitraffic_hasty_report

    - name: Assert OxiTraffic refuses a visit reported too soon
      ansible.builtin.assert:
        that: oxitraffic_hasty_report.status == 400
        fail_msg: >-
          OxiTraffic accepted a visit reported immediately after registration
          ({{ oxitraffic_hasty_report.status }}), so the minimum-delay gate is not working
          and the count below is not evidence of a real visit
        success_msg: >-
          OxiTraffic refuses a visit reported before the minimum delay (400), so a counted
          visit has to have gone through the whole flow

    - name: Register the page view again, this time to see it through
      ansible.builtin.uri:
        url: "{{ oxitraffic_verify_url }}/register?path={{ oxitraffic_verify_path | urlencode }}"
        return_content: true
        status_code: [200]
      register: oxitraffic_registration_again

    - name: Stay on the page for longer than OxiTraffic's minimum delay
      ansible.builtin.pause:
        seconds: "{{ oxitraffic_verify_min_delay_seconds }}"

    - name: Report the visit, the way the tracking script would
      ansible.builtin.uri:
        url: "{{ oxitraffic_verify_url }}/post-sleep/{{ oxitraffic_registration_again.content | trim }}"
        status_code: [200]
      register: oxitraffic_report

    - name: Count visits to the page again
      ansible.builtin.uri:
        url: "{{ oxitraffic_verify_url }}/api/count?path={{ oxitraffic_verify_path | urlencode }}"
        return_content: true
        status_code: [200]
      register: oxitraffic_count_after

    # The same question about a page nobody ever visited. Without it, a counter
    # that ignored its query and returned every visit there is would look
    # exactly like a working one.
    - name: Count visits to a page that was never visited
      ansible.builtin.uri:
        url: "{{ oxitraffic_verify_url }}/api/count?path={{ oxitraffic_verify_absent_path | urlencode }}"
        return_content: true
        status_code: [200]
      register: oxitraffic_count_absent

    - name: Read the visit counts back off the API
      ansible.builtin.uri:
        url: "{{ oxitraffic_verify_url }}/api/counts"
        status_code: [200]
      register: oxitraffic_counts

    - name: Assert OxiTraffic counted the page view and nothing else
      ansible.builtin.assert:
        that:
          - (oxitraffic_count_before.content | trim | int) == 0
          - (oxitraffic_count_after.content | trim | int) == 1
          - (oxitraffic_count_absent.content | trim | int) == 0
          - (oxitraffic_counts.json | selectattr('path', 'equalto', oxitraffic_verify_path) | map(attribute='count') | list) == [1]
        fail_msg: >-
          The page view did not come back: {{ oxitraffic_verify_path }} counted
          {{ oxitraffic_count_before.content | trim }} before and
          {{ oxitraffic_count_after.content | trim }} after,
          {{ oxitraffic_verify_absent_path }} counted {{ oxitraffic_count_absent.content | trim }},
          and /api/counts says {{ oxitraffic_counts.json }}
        success_msg: >-
          OxiTraffic registered a visit to {{ oxitraffic_verify_path }}, held it for the
          minimum delay, counted exactly one, and still counts none for a page nobody visited

    # OxiTraffic's own API could be answering out of the in-process visitor
    # state it keeps while a visit is in flight. This is the check that says the
    # visit landed in the Postgres the role wired up, in the database
    # `oxitraffic_database_name` names, over the Unix socket the role mounts -
    # none of which OxiTraffic would have found on its own.
    - name: Read the page view back out of Postgres
      ansible.builtin.command:
        cmd: >-
          {{ oxitraffic_verify_psql }}
          "select paths.path || '|' || count(visits.id)
           from paths join visits on visits.path_id = paths.id
           group by paths.path"
      register: oxitraffic_postgres_visits
      changed_when: false

    - name: Read OxiTraffic's schema out of Postgres
      ansible.builtin.command:
        cmd: >-
          {{ oxitraffic_verify_psql }}
          "select to_regclass('public.paths') is not null
           and to_regclass('public.visits') is not null
           and to_regclass('public.referrers') is not null
           and to_regclass('public._sqlx_migrations') is not null"
      register: oxitraffic_postgres_schema
      changed_when: false

    - name: Assert the page view is in the Postgres database the role named
      ansible.builtin.assert:
        that:
          - (oxitraffic_postgres_schema.stdout | trim) == 't'
          - (oxitraffic_postgres_visits.stdout | trim) == (oxitraffic_verify_path ~ '|1')
        fail_msg: >-
          Postgres does not hold what OxiTraffic claims to have counted in
          {{ oxitraffic_database_name }}: schema present={{ oxitraffic_postgres_schema.stdout | trim }},
          rows={{ oxitraffic_postgres_visits.stdout | trim }}
        success_msg: >-
          The {{ oxitraffic_database_name }} database carries OxiTraffic's migrated schema
          and the visit row itself ({{ oxitraffic_postgres_visits.stdout | trim }})

    # ------------------------------------------------------------------
    # Nothing was quietly restarting while all of that was being checked
    # ------------------------------------------------------------------

    # `Restart=always` means the unit reads `active` while it is crash-looping,
    # and a loop is exactly what an OxiTraffic that cannot reach Postgres or the
    # tracked website would settle into - as the two controls above demonstrate
    # it does. The window opened before the round trip, which already spent more
    # than the unit's `RestartSec=30` inside it.
    - name: Watch the OxiTraffic service a little longer
      ansible.builtin.pause:
        seconds: 25

    - name: Sample the OxiTraffic restart counter again
      ansible.builtin.systemd_service:
        name: oxitraffic.service
      register: oxitraffic_restarts_after

    - name: Assert OxiTraffic never restarted
      ansible.builtin.assert:
        that:
          - oxitraffic_restarts_after.status.NRestarts == oxitraffic_restarts_before.status.NRestarts
          - (oxitraffic_restarts_after.status.NRestarts | int) == 0
        fail_msg: >-
          oxitraffic.service restarted ({{ oxitraffic_restarts_before.status.NRestarts }} to
          {{ oxitraffic_restarts_after.status.NRestarts }}), so `active` was hiding a crash loop
        success_msg: >-
          oxitraffic.service has never restarted
          ({{ oxitraffic_restarts_after.status.NRestarts }}), so it came up on the role's
          configuration the first time and stayed up

    - name: Show the OxiTraffic verification summary
      ansible.builtin.debug:
        msg:
          - "OxiTraffic systemd: {{ oxitraffic_service.status.ActiveState }}, restarts {{ oxitraffic_restarts_after.status.NRestarts }}"
          - "OxiTraffic version: {{ oxitraffic_defaults.oxitraffic_version }} from {{ oxitraffic_container.Config.Image }}"
          - "OxiTraffic unconfigured image: exited rc={{ oxitraffic_stock_control.rc }}"
          - "OxiTraffic no Postgres socket: exited rc={{ oxitraffic_dbless_control.rc }}"
          - "OxiTraffic no tracked website: exited rc={{ oxitraffic_offline_control.rc }}"
          - "OxiTraffic dashboard: {{ oxitraffic_dashboard.status }} on port {{ oxitraffic_container_http_port }}"
          - "OxiTraffic count.js: base {{ oxitraffic_scheme }}://{{ oxitraffic_hostname }}, origin {{ oxitraffic_count_js.access_control_allow_origin }}"
          - "OxiTraffic round trip: registered, refused early report {{ oxitraffic_hasty_report.status }}, counted {{ oxitraffic_count_after.content | trim }} (absent page {{ oxitraffic_count_absent.content | trim }})"
          - "OxiTraffic postgres ({{ oxitraffic_database_name }}): {{ oxitraffic_postgres_visits.stdout | trim }}"
