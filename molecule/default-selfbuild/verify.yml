# What this scenario is for is the self-building path, so what it checks that
# the `default` scenario does not is where the image came from: that it was
# built here rather than pulled, out of the source the role checked out, at the
# revision `oxitraffic_version` names, and that what came out of that build
# reports itself as that same version and can actually count a page view.
---
- name: Verify self-built OxiTraffic
  hosts: all
  become: true
  gather_facts: false

  vars:
    oxitraffic_verify_url: "http://127.0.0.1:{{ oxitraffic_container_http_port }}"

    oxitraffic_verify_stock_container: "{{ inventory_hostname }}-stock-control"

    oxitraffic_verify_psql: >-
      docker exec {{ oxitraffic_molecule_postgres_container }}
      psql -U {{ oxitraffic_molecule_postgres_superuser }}
      -d {{ oxitraffic_database_name }} -tAc

    oxitraffic_verify_path: /molecule-selfbuild-page
    oxitraffic_verify_absent_path: /molecule-never-visited-page

    # OxiTraffic will not count a visit registered less than `min_delay_secs`
    # ago, which defaults to 19 and which the role does not currently override.
    oxitraffic_verify_min_delay_seconds: 20

    oxitraffic_verify_units:
      - oxitraffic.service
      - postgres.service

  tasks:
    - name: Verify that OxiTraffic works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: oxitraffic_defaults

        # `--type container` is not optional here: the role gives the container and
        # the container network the same name, and a bare `docker inspect` answers
        # with whichever it finds first.
        - name: Inspect OxiTraffic container
          ansible.builtin.command:
            cmd: "docker inspect --type container {{ oxitraffic_molecule_container }}"
          register: oxitraffic_container_raw
          changed_when: false

        - name: Parse the OxiTraffic container definition
          ansible.builtin.set_fact:
            oxitraffic_container: "{{ (oxitraffic_container_raw.stdout | from_json)[0] }}"

        # ------------------------------------------------------------------
        # The image is one this host built, not one it downloaded
        # ------------------------------------------------------------------

        - name: Read the image the OxiTraffic container runs
          ansible.builtin.command:
            cmd: "docker inspect --type image {{ oxitraffic_container.Config.Image }}"
          register: oxitraffic_image_raw
          changed_when: false

        - name: Parse the OxiTraffic image definition
          ansible.builtin.set_fact:
            oxitraffic_image: "{{ (oxitraffic_image_raw.stdout | from_json)[0] }}"

        # A pulled image carries the digest of the registry manifest it came from.
        # A locally built one has nothing to carry, so an empty `RepoDigests` is
        # what separates `oxitraffic_container_image_self_build: true` having done
        # something from the role having quietly downloaded the published image.
        - name: Assert the OxiTraffic image was built here rather than pulled
          ansible.builtin.assert:
            that:
              - (oxitraffic_image.RepoDigests | default([]) | length) == 0
              - oxitraffic_container.Config.Image is not search('/mo8it/')
            fail_msg: >-
              {{ oxitraffic_container.Config.Image }} came from a registry
              ({{ oxitraffic_image.RepoDigests | default([]) }}), so this scenario tested the
              published image rather than the self-building path it exists to cover
            success_msg: >-
              {{ oxitraffic_container.Config.Image }} has no registry digest and no registry
              prefix, so it was built on this host out of the role's own source checkout

        # `ansible.builtin.git` clones and checks out; these two only want to read
        # what the role's own checkout ended up at, which the module cannot do.
        - name: Read the revision the role checked the OxiTraffic source out at  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: "git -C {{ oxitraffic_molecule_src_path }} rev-parse HEAD"
          register: oxitraffic_src_head
          changed_when: false

        - name: Read the revision `oxitraffic_version` names  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: "git -C {{ oxitraffic_molecule_src_path }} rev-parse refs/tags/{{ oxitraffic_defaults.oxitraffic_version }}^{commit}"
          register: oxitraffic_src_tag
          changed_when: false

        - name: Assert the source was checked out at the version the role pins
          ansible.builtin.assert:
            that: oxitraffic_src_head.stdout | trim == oxitraffic_src_tag.stdout | trim
            fail_msg: >-
              {{ oxitraffic_molecule_src_path }} is at {{ oxitraffic_src_head.stdout | trim }},
              but {{ oxitraffic_defaults.oxitraffic_version }} is
              {{ oxitraffic_src_tag.stdout | trim }}
            success_msg: >-
              {{ oxitraffic_molecule_src_path }} is checked out at
              {{ oxitraffic_defaults.oxitraffic_version }}
              ({{ oxitraffic_src_head.stdout | trim }}), which is what the image was built from

        # The one negative control worth repeating here: whatever this build
        # produced still has to be an OxiTraffic that needs the role's configuration,
        # or nothing below is attributable to the role either.
        - name: Run the self-built image with none of the role's configuration
          ansible.builtin.command:
            cmd: >-
              timeout 60
              docker run --rm --name {{ oxitraffic_verify_stock_container }}
              {{ oxitraffic_container.Config.Image }}
          register: oxitraffic_stock_control
          changed_when: true
          failed_when: false

        - name: Assert the self-built image cannot start without the role's configuration
          ansible.builtin.assert:
            that:
              - oxitraffic_stock_control.rc not in [0, 124]
              - "'Failed to parse the configuration' in oxitraffic_stock_control.stderr"
            fail_msg: >-
              The unconfigured self-built image exited with {{ oxitraffic_stock_control.rc }}
              ({{ oxitraffic_stock_control.stderr | default('') | truncate(300) }}),
              so nothing below can be credited to the role
            success_msg: >-
              The unconfigured self-built image dies on startup
              (rc={{ oxitraffic_stock_control.rc }}), so an OxiTraffic that serves anything at
              all is the role's doing

        # ------------------------------------------------------------------
        # What was built runs, and reports itself as what was asked for
        # ------------------------------------------------------------------

        - name: Wait for the OxiTraffic systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: oxitraffic_services
          until: oxitraffic_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ oxitraffic_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the OxiTraffic systemd services are active
          ansible.builtin.assert:
            that: oxitraffic_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(oxitraffic_verify_units | zip(oxitraffic_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the OxiTraffic systemd services log for debugging
          when: oxitraffic_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ oxitraffic_verify_units }}"

        - name: Wait for the self-built OxiTraffic to serve its dashboard (up to 5m)
          ansible.builtin.uri:
            url: "{{ oxitraffic_verify_url }}/"
            follow_redirects: none
            return_content: true
            status_code: [200, 404, 502, 503]
          register: oxitraffic_dashboard
          until: oxitraffic_dashboard.status == 200
          retries: 60
          delay: 5

        # This is the assertion the self-building path most needs, and the one most
        # likely to catch upstream drifting: the Containerfile in the checked-out
        # source does not build that source. It runs `cargo install oxitraffic
        # --locked`, which fetches whatever version crates.io publishes as the
        # latest at build time. So the binary that comes out is only the pinned
        # version for as long as crates.io and the container tags stay in step. If
        # this ever fails while the checkout above is at the right revision, the
        # role is self-building a different version than it pins, and that is worth
        # knowing rather than papering over.
        - name: Assert the self-built OxiTraffic is the version this role pins
          ansible.builtin.assert:
            that:
              - (oxitraffic_defaults.oxitraffic_version ~ ' - <a href="https://codeberg.org/mo8it/oxitraffic"') in oxitraffic_dashboard.content
            fail_msg: >-
              The self-built OxiTraffic reports
              {{ oxitraffic_dashboard.content | regex_search('v[0-9][0-9.]* - <a href="https://codeberg.org/mo8it/oxitraffic"') | default('no version at all', true) }},
              but `oxitraffic_version` pins {{ oxitraffic_defaults.oxitraffic_version }}.
              The Containerfile installs OxiTraffic from crates.io rather than from the
              source it was checked out with, so the two can drift apart.
            success_msg: >-
              The self-built OxiTraffic reports itself as
              {{ oxitraffic_defaults.oxitraffic_version }}, which is what `oxitraffic_version`
              pins

        - name: Fetch the tracking script the self-built OxiTraffic serves
          ansible.builtin.uri:
            url: "{{ oxitraffic_verify_url }}/count.js"
            return_content: true
            status_code: [200]
          register: oxitraffic_count_js

        - name: Assert the tracking script was built from the role's configuration
          ansible.builtin.assert:
            that:
              - ('"' ~ oxitraffic_scheme ~ '://' ~ oxitraffic_hostname ~ '/register?path="') in oxitraffic_count_js.content
              - oxitraffic_count_js.access_control_allow_origin == oxitraffic_tracked_origin
              - oxitraffic_container_http_port not in [80, 8080]
            fail_msg: >-
              count.js does not point at {{ oxitraffic_scheme }}://{{ oxitraffic_hostname }}
              (or allows origin {{ oxitraffic_count_js.access_control_allow_origin | default('none') }}
              rather than {{ oxitraffic_tracked_origin }}):
              {{ oxitraffic_count_js.content | truncate(300) }}
            success_msg: >-
              The self-built OxiTraffic answers on {{ oxitraffic_container_http_port }}, calls
              back to {{ oxitraffic_scheme }}://{{ oxitraffic_hostname }} and is served for
              origin {{ oxitraffic_tracked_origin }}, all of which come from the role

        # ------------------------------------------------------------------
        # A self-built binary counts a page view into Postgres like any other
        # ------------------------------------------------------------------

        - name: Sample the OxiTraffic restart counter before the round trip
          ansible.builtin.systemd_service:
            name: oxitraffic.service
          register: oxitraffic_restarts_before

        - name: Register a page view, the way the tracking script would
          ansible.builtin.uri:
            url: "{{ oxitraffic_verify_url }}/register?path={{ oxitraffic_verify_path | urlencode }}"
            return_content: true
            status_code: [200]
          register: oxitraffic_registration

        - name: Stay on the page for longer than OxiTraffic's minimum delay
          ansible.builtin.pause:
            seconds: "{{ oxitraffic_verify_min_delay_seconds }}"

        - name: Report the visit, the way the tracking script would
          ansible.builtin.uri:
            url: "{{ oxitraffic_verify_url }}/post-sleep/{{ oxitraffic_registration.content | trim }}"
            status_code: [200]
          register: oxitraffic_report

        - name: Count visits to the page
          ansible.builtin.uri:
            url: "{{ oxitraffic_verify_url }}/api/count?path={{ oxitraffic_verify_path | urlencode }}"
            return_content: true
            status_code: [200]
          register: oxitraffic_count_after

        # The same question about a page nobody ever visited, so that a counter
        # ignoring its query cannot pass for a working one.
        - name: Count visits to a page that was never visited
          ansible.builtin.uri:
            url: "{{ oxitraffic_verify_url }}/api/count?path={{ oxitraffic_verify_absent_path | urlencode }}"
            return_content: true
            status_code: [200]
          register: oxitraffic_count_absent

        - name: Read the page view back out of Postgres
          ansible.builtin.command:
            cmd: >-
              {{ oxitraffic_verify_psql }}
              "select paths.path || '|' || count(visits.id)
               from paths join visits on visits.path_id = paths.id
               group by paths.path"
          register: oxitraffic_postgres_visits
          changed_when: false

        - name: Assert the self-built OxiTraffic counted the page view into Postgres
          ansible.builtin.assert:
            that:
              - (oxitraffic_count_after.content | trim | int) == 1
              - (oxitraffic_count_absent.content | trim | int) == 0
              - (oxitraffic_postgres_visits.stdout | trim) == (oxitraffic_verify_path ~ '|1')
            fail_msg: >-
              The page view did not come back: {{ oxitraffic_verify_path }} counted
              {{ oxitraffic_count_after.content | trim }},
              {{ oxitraffic_verify_absent_path }} counted {{ oxitraffic_count_absent.content | trim }},
              and Postgres holds {{ oxitraffic_postgres_visits.stdout | trim }}
            success_msg: >-
              The self-built OxiTraffic counted one visit to {{ oxitraffic_verify_path }}, none
              for a page nobody visited, and the row is in the {{ oxitraffic_database_name }}
              database ({{ oxitraffic_postgres_visits.stdout | trim }})

        # `Restart=always` means the unit reads `active` while it is crash-looping.
        # The window opened before the round trip, which already spent more than the
        # unit's `RestartSec=30` inside it.
        - name: Watch the OxiTraffic service a little longer
          ansible.builtin.pause:
            seconds: 25

        - name: Sample the OxiTraffic restart counter again
          ansible.builtin.systemd_service:
            name: oxitraffic.service
          register: oxitraffic_service_after

        - name: Assert the self-built OxiTraffic never restarted
          ansible.builtin.assert:
            that:
              - oxitraffic_service_after.status.NRestarts == oxitraffic_restarts_before.status.NRestarts
              - (oxitraffic_service_after.status.NRestarts | int) == 0
            fail_msg: >-
              oxitraffic.service restarted ({{ oxitraffic_restarts_before.status.NRestarts }} to
              {{ oxitraffic_service_after.status.NRestarts }}), so `active` was hiding a crash loop
            success_msg: >-
              oxitraffic.service has never restarted
              ({{ oxitraffic_service_after.status.NRestarts }})

        - name: Show the OxiTraffic verification summary
          ansible.builtin.debug:
            msg:
              - "OxiTraffic systemd: {% for unit, state in oxitraffic_verify_units | zip(oxitraffic_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "OxiTraffic image: {{ oxitraffic_container.Config.Image }}, registry digests {{ oxitraffic_image.RepoDigests | default([]) | length }}"
              - "OxiTraffic source: {{ oxitraffic_molecule_src_path }} at {{ oxitraffic_src_head.stdout | trim }} ({{ oxitraffic_defaults.oxitraffic_version }})"
              - "OxiTraffic unconfigured image: exited rc={{ oxitraffic_stock_control.rc }}"
              - "OxiTraffic dashboard: {{ oxitraffic_dashboard.status }} on port {{ oxitraffic_container_http_port }}"
              - "OxiTraffic count.js: base {{ oxitraffic_scheme }}://{{ oxitraffic_hostname }}, origin {{ oxitraffic_count_js.access_control_allow_origin }}"
              - "OxiTraffic postgres ({{ oxitraffic_database_name }}): {{ oxitraffic_postgres_visits.stdout | trim }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the OxiTraffic systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=oxitraffic.service
          register: oxitraffic_service_log
          changed_when: false

        - name: Show the OxiTraffic systemd service log
          ansible.builtin.debug:
            var: oxitraffic_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "OxiTraffic verification failed. The systemd service log is printed above."
