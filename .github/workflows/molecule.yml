---
name: molecule

on:  # yamllint disable-line rule:truthy
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  workflow_dispatch:

jobs:
  molecule:
    name: Run Molecule scenario 'default' on ${{ matrix.distro }}
    runs-on: ubuntu-latest

    # Same-repository pull requests already run via the push event;
    # run pull_request jobs only for pull requests from forks.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      matrix:
        distro:
          - ubuntu2604
      fail-fast: false

    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          path: oxitraffic

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: oxitraffic/.python-version
          cache: pip
          cache-dependency-path: oxitraffic/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: oxitraffic
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('oxitraffic/molecule/*/requirements.yml') }}

      - name: Run Molecule
        working-directory: oxitraffic
        run: molecule test --scenario-name default

  # The self-build scenario compiles OxiTraffic from source, which takes the
  # better part of half an hour of runner time and exercises upstream's
  # Containerfile rather than anything this role renders. It is only worth
  # spending that when the version being built has actually changed - or when
  # somebody asks for it by hand.
  self-build-relevant:
    name: Check whether the OxiTraffic version changed
    runs-on: ubuntu-latest

    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    outputs:
      bumped: ${{ steps.check.outputs.bumped }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Look for a changed version in defaults/main.yml
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'Asked for by hand'
            echo 'bumped=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base=''
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD || true)"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base="$(git rev-parse 'HEAD~1' 2>/dev/null || true)"
          fi

          if [ -z "$base" ]; then
            echo 'No commit to compare against; assuming the version changed'
            echo 'bumped=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff "$base" HEAD -- defaults/main.yml | grep -qE '^[+-][A-Za-z0-9_]+_version:'; then
            echo "A version changed between $base and HEAD"
            echo 'bumped=true' >> "$GITHUB_OUTPUT"
          else
            echo "No version changed between $base and HEAD"
            echo 'bumped=false' >> "$GITHUB_OUTPUT"
          fi

  molecule-self-build:
    name: Run Molecule scenario 'default-selfbuild' on ubuntu2604
    runs-on: ubuntu-latest

    needs: self-build-relevant
    if: needs.self-build-relevant.outputs.bumped == 'true'

    env:
      MOLECULE_DISTRO: ubuntu2604
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          path: oxitraffic

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: oxitraffic/.python-version
          cache: pip
          cache-dependency-path: oxitraffic/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: oxitraffic
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('oxitraffic/molecule/default-selfbuild/requirements.yml') }}

      - name: Run Molecule
        working-directory: oxitraffic
        run: molecule test --scenario-name default-selfbuild
